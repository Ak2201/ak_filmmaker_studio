# The release gate from docs/BRANCHING.md, run by GitHub instead of by hand.
# Three jobs in parallel so the long page check does not hold up the rest.
# Branch protection on main (owner-only) should require all three.
name: Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    # main is here as a BACKSTOP, not as the design. The design is
    # branch protection requiring these three checks on a PR, so a
    # bad commit never reaches main at all. Until that is on, a
    # direct push to main ran NOTHING — which is how the domain
    # change shipped on 11 Oct with only a local gate behind it.
    # Listing main means a direct push is at least reported, after
    # the fact, instead of silently unchecked.
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # test:schema uses runuser only when root with no PGHOST; on the
      # runner it connects through these.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: npm run test:all

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:open
      # Uncapped on purpose: a time cap kills Chromium mid-sweep and reads
      # as a "browser closed" failure (CLAUDE.md).
      - run: npm run verify 2>&1 | tee verify.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: what failed
        if: failure()
        run: |
          grep -E '^✗' verify.log || true
          node -e '
            const t = require("fs").readFileSync("verify.log", "utf8");
            const i = t.indexOf("[\n  {"); if (i < 0) process.exit(0);
            const rows = JSON.parse(t.slice(i, t.lastIndexOf("]") + 1));
            for (const r of rows) if (r.FAIL && r.FAIL.length) console.log((r.page || r.name) + ": " + r.FAIL.join(" | ").slice(0, 600));
          ' || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          retention-days: 7

      # In THIS job, not `proofs`: it serves `dist/`, and a signed-out
      # visitor needs the GATE-OFF build that `build:open` above left
      # there — the proofs job's `dist/` is the gated one and the site
      # gate would bounce the hub. Two sessions added this step on the
      # same day; this is the surviving copy, kept LAST because the two
      # `if: failure()` steps above belong to `verify` and should not
      # fire, or upload a verify.log artifact, for an adoption failure.
      - run: npm run prove:adoption
      # The Story path per format, against the same gate-off build.
      - run: npm run prove:story-path
      # No native confirm/alert/prompt: the in-app dialog appears, Cancel keeps data.
      - run: npm run prove:dialogs
      - run: npm run prove:script
      - run: npm run prove:replace
      - run: npm run prove:cards
      - run: npm run prove:presence
      - run: npm run prove:ai-desk

  proofs:
    name: proofs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: gated build
        run: npm run build
      - run: npm run test:ai-lazy
      - run: npm run prove:gate
      - run: npm run prove:billing
      - run: npm run prove:storage
      - run: npm run prove:cloud-delete
      - run: npm run prove:drive
      - run: npm run prove:sw
      - run: npm run build:extension
      - run: npm run prove:extension
      - name: open build for the growth and AI proofs
        run: npm run build:verify
      - run: npm run prove:growth
      - run: npm run prove:ai-coverage
      # One frame per page whichever link opened it (colour, lit stage,
      # crumb stage, band tools, header, tab layout), at 1280 and 390.
      # dist/ here is the GATED build, so it reads the open one above.
      - run: npm run prove:nav
        env:
          PROVE_DIST: dist-verify
      # Scroll and fragment landings on the open build, like prove:nav.
      - run: npm run prove:scroll
        env:
          PROVE_DIST: dist-verify
