<!DOCTYPE html>
<html lang="en" data-volume="studio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A browser-based studio for independent filmmakers: write the script, plan the shoot, run the set. Pay once, no subscription, works offline. Your work is saved in your browser, with optional sign-in sync and Google Drive backup.">
<meta name="theme-color" content="#16140f">
<title>{{brand:name}}</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand:name}}">
<meta property="og:title" content="{{brand:name}}">
<meta property="og:description" content="Write the script, plan the shoot, run the set — a browser-based studio for independent filmmakers. Pay once, no subscription, works offline.">
<meta property="og:url" content="https://{{brand:host}}/">
<meta property="og:image" content="https://{{brand:host}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{brand:name}} — Pay once. No subscription. Works offline.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{brand:name}}">
<meta name="twitter:description" content="Write the script, plan the shoot, run the set — a browser-based studio for independent filmmakers. Pay once, no subscription, works offline.">
<meta name="twitter:image" content="https://{{brand:host}}/og.png">
<!-- Google Search Console ownership, and it is load-bearing for SIGN-IN
     rather than for search. Google refused to verify the OAuth consent
     screen's branding with "the website of your home page URL is not
     registered to you", so until this tag is live and Search Console has
     seen it, the consent screen cannot show the app name or these links.
     The token is public by design. DO NOT REMOVE IT after verification
     succeeds — Search Console re-checks, and losing the property would
     un-verify the branding again.
     Only the home page needs it; the property is the site root. -->
<meta name="google-site-verification" content="-V57AheDJ9rRv8rvQKN1QR5ddeJbuvc7jOgJKvTOocQ" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap">
<!-- The icon font (Material Symbols, subsetted to navigation.json's
     `sym` names) is injected here at build by materialSymbols() in
     vite.config.js — do not paste the <link> by hand. -->
<script type="module" src="./src/pages/hub.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app"></div>
<noscript>
  <p style="padding:2rem;font-family:Georgia,serif">
    The Studio needs JavaScript — it is a writing tool, not an article.
    Your work is stored in this browser and never sent anywhere.
  </p>
</noscript>
</body>
</html>
