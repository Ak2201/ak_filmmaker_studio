<!-- Google Search Console ownership, and it is load-bearing for SIGN-IN
     rather than for search. Google refused to verify the OAuth consent
     screen's branding with "the website of your home page URL is not
     registered to you", so until this tag is live and Search Console has
     seen it, the consent screen cannot show the app name or these links.
     The token is public by design. DO NOT REMOVE IT after verification
     succeeds — Search Console re-checks, and losing the property would
     un-verify the branding again.
     Only the home page needs it; the property is the site root. -->
<meta name="google-site-verification" content="-V57AheDJ9rRv8rvQKN1QR5ddeJbuvc7jOgJKvTOocQ" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap">
<!-- The launcher's icons, as a SUBSETTED Material Symbols face.

     Two things in this URL are load-bearing and both will look like
     noise to anyone tidying it.

     `icon_names=` names exactly the symbols navigation.json uses and
     Google returns a font containing only those: 14,388 bytes against
     1,216,724 for the full face, measured, an 85x difference on a file
     that sits in first paint. Add a module with a new `sym` and this
     list must gain that name.

     AND A MISSPELT NAME DOES NOT FAIL — it silently serves the WHOLE
     FACE. The API answers 200 either way, so neither the status nor
     the page tells you; the only tell is the size. Measured: one real
     name returns ~2KB, `definitely_not_a_real_symbol_xyz` returns all
     1,216,724. So verify a new name against the API before shipping
     it, because the failure mode is not a missing glyph, it is a
     megabyte on every page. No number of symbols is written here on
     purpose: a count is wrong the next time a module is added.

     `display=block` rather than the `swap` the line above uses. These
     glyphs are produced by LIGATURES on literal text, so under `swap`
     a slow network paints the words "description history folder"
     across the map before the font arrives. Block renders nothing for
     up to three seconds instead, which is the right trade for a mark
     that is decorative — every icon here is aria-hidden and sits
     beside its own text label.

     Needs no CSP change: style-src already allows fonts.googleapis.com
     and font-src already allows fonts.gstatic.com. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=article,assessment,auto_stories,calendar_month,category,checklist,content_copy,content_cut,currency_rupee,dashboard,description,edit_note,event,folder,format_list_numbered,grid_view,groups,history,home,inventory_2,label,lightbulb,list,local_library,mail,menu_book,movie,music_note,palette,perm_media,person,place,play_circle,settings,slideshow,speed,table_chart,timeline,timer,tune,videocam,view_list&display=block">
<script type="module" src="./src/pages/hub.js"></script>
</head>
