# Netlify equivalent of vercel.json. Kept deliberately in step with it —
# if you change a header or a route in one, change it in the other, or
# the two deploys diverge in ways only a browser console will tell you.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # vite 8 / rolldown need ^20.19 || >=22.12. Netlify's default image has
  # shipped older Node before now, and the failure is an unhelpful
  # "styleText is not exported from node:util" at build time.
  NODE_VERSION = "22"
  # package.json now also carries engines.node ">=22.12", which is what
  # Vercel and most other hosts read. Netlify prefers this explicit pin,
  # so both exist on purpose — they must not disagree.

# ---- headers -------------------------------------------------
# Hashed assets are immutable; HTML and the service worker must never be
# held, or a deploy strands users on an old shell.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/marketing/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    # The CSP invariant 5 relies on. script-src is 'self' with no
    # 'unsafe-inline': an inline handler breaks the page under it.
    #
    # connect-src also names api.anthropic.com AND
    # generativelanguage.googleapis.com — the two bring-your-own-key
    # providers in src/lib/ai-providers.js. Each is a direct browser call
    # with the user's own key, from a build that has no server to make
    # the call for it. Both entries are needed, not one: a user who has
    # switched to the provider the CSP does not name gets a fetch blocked
    # before it leaves, and the only symptom is a TypeError. If a third
    # provider is ever added to that table, its origin belongs here and
    # in vercel.json in the same commit.
    #
    # connect-src ALSO names the two Google Fonts hosts. Beside style-src
    # and font-src that looks redundant and is not: a service worker's own
    # fetch() is governed by connect-src, and sw.js intercepts those hosts
    # deliberately (isFontHost -> cacheFirst) to cache the faces for
    # offline use. Without these two entries that fetch is refused,
    # cacheFirst finds nothing cached, rethrows, respondWith rejects, and
    # the page takes an ERR_FAILED on the stylesheet — so the fonts never
    # load and every returning visitor renders in fallback serif. The
    # first-ever visit, the dev server and `npm run verify` all look
    # correct, because none of them has a service worker controlling it.
    #
    # GOOGLE DRIVE BACKUP adds four entries, and all four are needed
    # for one feature (src/lib/drive.js):
    #   script-src  https://accounts.google.com/gsi/client — the Google
    #               Identity Services library, injected on CONNECT and
    #               never on a page that has not connected.
    #   connect-src https://www.googleapis.com — the Drive REST calls.
    #   connect-src https://accounts.google.com/gsi/ and
    #   frame-src   https://accounts.google.com/gsi/ — the SILENT token
    #               request is an iframe, which is what makes an
    #               expired hour-old token renew without a prompt.
    #   style-src   https://accounts.google.com/gsi/style — GIS's own
    #               sheet, per Google's published CSP guidance.
    # Leave any of them out and the browser refuses before the request
    # leaves, with no network entry and nothing in the gate to say so.
    #
    # img-src names blob: (and data:) for the storyboard's DRAWN frames
    # (src/lib/board-frames.js): Gemini's picture and the copy fetched
    # back from the writer's Drive are both shown through an object URL
    # (blob:), never a stored image. The Gemini call itself is covered
    # by connect-src https://generativelanguage.googleapis.com and the
    # Drive upload/download by https://www.googleapis.com. Checked
    # 14 Oct 2026: both already present here AND in vercel.json.
    #
    # This value must stay byte-identical to the one in vercel.json.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: blob: https://*.razorpay.com https://*.googleusercontent.com; media-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://generativelanguage.googleapis.com https://www.googleapis.com https://accounts.google.com/gsi/ https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://accounts.google.com/gsi/ https://api.razorpay.com https://checkout.razorpay.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# ---- old URLs ------------------------------------------------
# force = true because the stub files still exist in dist/; without it
# Netlify serves the file and the redirect never fires. Browsers carry
# the #fragment across a 301, so deep links to a step survive.

[[redirects]]
  from = "/arunak-filmmaker-blueprint.html"
  to = "/feature.html"
  status = 301
  force = true

[[redirects]]
  from = "/arunak-shortfilm-blueprint.html"
  to = "/short.html"
  status = 301
  force = true

[[redirects]]
  from = "/arunak-filmmaker-library.html"
  to = "/library.html"
  status = 301
  force = true

# ---- clean URLs ----------------------------------------------
# status 200 = rewrite, not redirect: the address bar keeps /feature.
# One per page. This listed four when the app had four; nine more
# shipped since, and /stripboard 404ing while /feature works is the
# kind of gap nobody notices until someone shares a link.

# NOTE — this one legitimately differs from vercel.json, which targets
# "/" rather than "/index.html". Vercel sets cleanUrls:true, so it 308s
# /index.html to /, and a rewrite POINTING AT /index.html is caught by
# that redirect and 404s. Netlify has no such interaction, so /studio keeps
# /index.html. /shared/:token is a REDIRECT to /?share= on both hosts: the
# build uses relative asset paths, so a rewrite served at /shared/x would
# load assets from /shared/assets/.
[[redirects]]
  from = "/studio"
  to = "/index.html"
  status = 200

