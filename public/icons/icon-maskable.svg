<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FilmMakerStudio">
  <title>FilmMakerStudio</title>
  <defs>
    <clipPath id="board"><rect x="76" y="222" width="360" height="186" rx="10"/></clipPath>
    <clipPath id="stick"><rect x="76" y="150" width="360" height="62" rx="6"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="#ece9f6"/>

  <g transform="translate(58 58) scale(0.773438)">
    <!-- the clapper stick, hinged open -->
    <g transform="rotate(-9 76 212)">
      <rect x="76" y="150" width="360" height="62" rx="6" fill="#1b1727"/>
      <g fill="#ece9f6" clip-path="url(#stick)">
        <polygon points="124,150 154,150 136,212 106,212"/><polygon points="209,150 239,150 221,212 191,212"/><polygon points="294,150 324,150 306,212 276,212"/><polygon points="379,150 409,150 391,212 361,212"/>
      </g>
    </g>

    <!-- the slate -->
    <rect x="76" y="222" width="360" height="186" rx="10" fill="#120f1c"/>

    <!-- two ruled lines, as on a real slate -->
    <g fill="#ece9f6" opacity="0.14">
      <rect x="112" y="284" width="288" height="12" rx="6"/>
      <rect x="112" y="318" width="196" height="12" rx="6"/>
    </g>

    <!-- the three volumes, the same stripe the toolbar wears -->
    <g clip-path="url(#board)">
      <rect x="76"  y="376" width="120" height="32" fill="#9575f8"/>
      <rect x="196" y="376" width="120" height="32" fill="#60a5fa"/>
      <rect x="316" y="376" width="120" height="32" fill="#d6a44a"/>
    </g>
  </g>
</svg>
