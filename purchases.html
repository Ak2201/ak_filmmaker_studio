<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — {{brand:name}}</title>
<meta name="description" content="Moved: purchases are now the Purchases tab of the console.">
<meta name="robots" content="noindex, nofollow">
<!-- The administrators' purchases page is the Purchases tab of the
     console now. src/pages/moved.js keeps the fragment, so
     purchases.html#promos lands on admin.html#promos, inside that tab;
     without scripts the refresh below lands on the tab. -->
<meta name="fms-moved" content="admin.html#purchases">
<link vite-ignore rel="canonical" href="./admin.html#purchases">
<noscript><meta http-equiv="refresh" content="0; url=./admin.html#purchases"></noscript>
<script type="module" src="/src/pages/moved.js"></script>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
</head>
<body>
<p>Purchases moved into the <a href="./admin.html#purchases">console</a>.</p>
</body>
</html>
