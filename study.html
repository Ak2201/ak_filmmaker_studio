<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — FilmMakerStudio</title>
<!-- The case studies are a tab of the Library now. src/pages/moved.js
     sends study.html#<section> to library.html#cs-<section>; without
     scripts the refresh below lands on the tab. -->
<meta name="fms-moved" content="library.html#case-studies" data-prefix="cs-">
<!-- vite-ignore: Vite treats a canonical href as an asset and emitted an
     unbuilt copy of the page into assets/*.html, which the worker precached. -->
<link vite-ignore rel="canonical" href="./library.html#case-studies">
<noscript><meta http-equiv="refresh" content="0; url=./library.html#case-studies"></noscript>
<script type="module" src="/src/pages/moved.js"></script>
</head>
<body>
<p>The case studies moved into the <a href="./library.html#case-studies">Library</a>.</p>
<p>Your saved work is untouched — it lives in this browser and the Library reads the same storage.</p>
</body>
</html>
